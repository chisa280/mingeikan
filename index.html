<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>メディア表現D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="room">
    <img id="room-img" src="room.jpg" alt="" onerror="this.style.display='none'">
  </div>

  <div id="ui">
    <div id="count-wrap">
      <span id="count-label">収集された民芸品</span>
      <span id="count-num">0 点</span>
    </div>
    <div id="msg">QRコードをスキャンして民芸品を集めよう</div>
  </div>

  <!-- リセットボタン -->
  <button id="btn-reset">リセット</button>

  <!-- 民芸品表示オーバーレイ -->
  <div id="scan-overlay" class="hide">
    <div class="scan-title" id="overlay-name">—</div>
    <div class="artifact-preview">
      <img id="overlay-img" src="" alt="">
    </div>
    <div class="scan-sub" id="overlay-desc">読み込み中...</div>
    <button class="btn-place" id="btn-place">この空間に置く</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
